name: Build plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-13 }   # Intel pool: the arm64 pool has refused to allocate all week.
                                            # The build is universal anyway, so this still
                                            # produces the arm64 slices an M-series Mac needs.
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      # ctest finds the test program itself, so this no longer depends on where the generator
      # puts it (the Nov 21 Windows run on the VS 2026 image failed here with exit code 127 in
      # under a second, before any test ran). --output-on-failure prints the checks if one fails.
      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/VST3
          cp -R build/*_artefacts/Release/VST3/*.vst3 dist/VST3/
          cp INSTALL.txt dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p dist/AU
            cp -R build/*_artefacts/Release/AU/*.component dist/AU/
            find dist -name "*.vst3" -maxdepth 2 -exec codesign --force --deep --sign - {} \;
            find dist -name "*.component" -maxdepth 2 -exec codesign --force --deep --sign - {} \;
            ditto -c -k --keepParent dist PodSherpa-macOS.zip
          else
            7z a PodSherpa-Windows.zip ./dist/*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PodSherpa-${{ matrix.name }}
          path: PodSherpa-*.zip
